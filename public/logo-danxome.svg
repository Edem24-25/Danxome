<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A843"/>
      <stop offset="25%" stop-color="#F2D06B"/>
      <stop offset="50%" stop-color="#C9952D"/>
      <stop offset="75%" stop-color="#E8C84A"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="50%" stop-color="#D4A843"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="adinkraPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.5" fill="#D4A843" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="420" height="120" fill="url(#adinkraPattern)" rx="8"/>

  <text x="10" y="82" font-family="'Fraunces', Georgia, serif" font-size="72" font-weight="900" font-style="italic" fill="url(#goldMetal)" filter="url(#shadow)" letter-spacing="-1">Dan</text>

  <text x="168" y="82" font-family="'Fraunces', Georgia, serif" font-size="72" font-weight="900" font-style="italic" fill="url(#goldMetal)" filter="url(#shadow)" letter-spacing="-1">Xomè</text>

  <g transform="translate(380, 28)" opacity="0.6">
    <circle cx="18" cy="38" r="14" fill="none" stroke="url(#goldMetal)" stroke-width="2"/>
    <line x1="18" y1="28" x2="18" y2="48" stroke="url(#goldMetal)" stroke-width="1.5"/>
    <line x1="8" y1="38" x2="28" y2="38" stroke="url(#goldMetal)" stroke-width="1.5"/>
    <circle cx="18" cy="38" r="3" fill="url(#goldMetal)"/>
  </g>

  <text x="148" y="108" font-family="'Manrope', sans-serif" font-size="16" font-weight="600" fill="#8B6914" letter-spacing="8" text-anchor="middle">BÉNIN</text>

  <line x1="80" y1="92" x2="210" y2="92" stroke="url(#goldStroke)" stroke-width="1" opacity="0.5"/>
</svg>
